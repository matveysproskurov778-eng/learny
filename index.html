<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learny">
<meta name="theme-color" content="#06b6d4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<title>Learny</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#f0fbff;color:#0f172a;display:flex;flex-direction:column;user-select:none}

  /* SVG Icon defaults */
  svg.icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0; }
  .icon-lg { width: 28px; height: 28px; stroke-width: 2.2; }
  .icon-xl { width: 48px; height: 48px; stroke-width: 1.8; }
  .icon-logo { width: 26px; height: 26px; stroke-width: 2.2; margin-right: 4px; }

  /* ===== TOPBAR ===== */
  .topbar{background:linear-gradient(135deg,#06b6d4 0%,#0ea5e9 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 4px 20px rgba(6,182,212,.35),0 1px 0 rgba(255,255,255,.15) inset}
  .logo{font-weight:900;font-size:18px;letter-spacing:-.3px;flex-shrink:0;display:flex;align-items:center;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.15)}
  .pills{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
  .pill{background:rgba(255,255,255,.25);padding:5px 10px;border-radius:30px;font-weight:800;font-size:12px;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;align-items:center;gap:4px}
  .iconbtn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .iconbtn:active{background:rgba(255,255,255,.42);transform:scale(.9)}
  .iconbtn.hidden{display:none}

  /* ===== HOME ===== */
  .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
  .hero{padding:22px 22px 20px;display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#ecfeff 0%,#f0fbff 100%);border-bottom:1px solid rgba(6,182,212,.08);position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(6,182,212,.15),transparent 70%);border-radius:50%;pointer-events:none}
  .hero-flag{font-size:48px;filter:drop-shadow(0 4px 8px rgba(6,182,212,.2))}
  .hero h1{font-size:24px;font-weight:900;color:#0f172a;letter-spacing:-.5px}
  .hero p{color:#64748b;font-weight:600;margin-top:3px;font-size:13px}
  .hero-xp{margin-left:auto;text-align:right;z-index:1}
  .hero-xp .big{font-size:28px;font-weight:900;color:#06b6d4;text-shadow:0 2px 4px rgba(6,182,212,.2)}
  .hero-xp .lbl{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:1.5px}

  .lessons{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
  .lesson-card{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid rgba(6,182,212,.1);border-radius:22px;background:#fff;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;width:100%;box-shadow:0 2px 8px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.06),0 8px 20px -8px rgba(6,182,212,.15);position:relative;overflow:hidden}
  .lesson-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(6,182,212,.03),transparent 60%);pointer-events:none}
  .lesson-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.06),0 12px 28px -8px rgba(6,182,212,.25)}
  .lesson-card:active{transform:translateY(1px);box-shadow:0 1px 4px rgba(15,23,42,.08),0 4px 10px -4px rgba(6,182,212,.15)}
  .lesson-card.done{border-color:rgba(6,182,212,.3);background:linear-gradient(135deg,#ecfeff 0%,#f0fbff 100%)}
  .lesson-card.locked{opacity:.5;cursor:not-allowed;box-shadow:0 2px 6px rgba(15,23,42,.04);background:#f8fafc}
  .lesson-card.locked:hover{transform:none;box-shadow:0 2px 6px rgba(15,23,42,.04)}
  .lesson-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#fff;box-shadow:0 4px 10px rgba(6,182,212,.35),0 2px 0 rgba(8,145,178,.6) inset,0 -2px 0 rgba(255,255,255,.2) inset;position:relative}
  .lesson-icon::after{content:'';position:absolute;top:6px;left:8px;right:8px;height:12px;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:50%;pointer-events:none}
  .lesson-icon.done{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 10px rgba(34,197,94,.35),0 2px 0 rgba(21,128,61,.6) inset,0 -2px 0 rgba(255,255,255,.2) inset}
  .lesson-icon.locked{background:linear-gradient(135deg,#cbd5e1,#94a3b8);box-shadow:0 3px 6px rgba(148,163,184,.3),0 2px 0 rgba(100,116,139,.4) inset}
  .lesson-icon.locked::after{opacity:.4}
  .lesson-info{flex:1;min-width:0;position:relative;z-index:1}
  .lesson-info h3{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:3px;letter-spacing:-.2px}
  .lesson-info p{color:#64748b;font-size:12px;font-weight:600}
  .lesson-arrow{color:#06b6d4;flex-shrink:0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
  .lesson-card.locked .lesson-arrow{color:#94a3b8}

  /* ===== LESSON VIEW ===== */
  .lesson-view{display:none;flex-direction:column;flex:1;padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden;background:linear-gradient(180deg,#f0fbff 0%,#ffffff 40%)}
  .lesson-view.active{display:flex;animation:slidein .3s cubic-bezier(.2,.9,.4,1.1)}
  @keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  .lesson-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-shrink:0}
  .close-btn{color:#94a3b8;cursor:pointer;background:rgba(255,255,255,.9);border:1px solid rgba(148,163,184,.15);width:36px;height:36px;border-radius:50%;padding:0;transition:.15s;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(15,23,42,.06)}
  .close-btn:active{transform:scale(.92);background:#f1f5f9}
  .prog-bg{flex:1;height:16px;background:rgba(148,163,184,.15);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04) inset}
  .prog-fill{height:100%;background:linear-gradient(90deg,#06b6d4,#0ea5e9);border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0;box-shadow:0 0 8px rgba(6,182,212,.5),0 -1px 0 rgba(255,255,255,.3) inset}
  .question-card{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .question{font-size:22px;font-weight:800;margin-bottom:24px;line-height:1.35;color:#0f172a;letter-spacing:-.3px}
  .question.small{font-size:19px}

  /* Speaker button */
  .speaker-row{display:flex;justify-content:center;margin-bottom:24px}
  .speaker-btn{width:110px;height:110px;border-radius:50%;border:none;background:linear-gradient(160deg,#22d3ee,#0891b2);color:#fff;cursor:pointer;transition:.12s;box-shadow:0 8px 20px rgba(6,182,212,.4),0 4px 0 #0e7490 inset,0 -4px 0 rgba(255,255,255,.25) inset;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .speaker-btn::after{content:'';position:absolute;top:8px;left:14px;right:14px;height:20px;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:50% 50% 40% 40%;pointer-events:none}
  .speaker-btn:active{transform:translateY(4px);box-shadow:0 4px 10px rgba(6,182,212,.4),0 2px 0 #0e7490 inset,0 -2px 0 rgba(255,255,255,.25) inset}

  /* Options */
  .options{display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;padding-bottom:8px}
  .option{padding:20px 22px;border:1px solid rgba(6,182,212,.12);border-radius:20px;font-size:17px;font-weight:700;color:#0f172a;cursor:pointer;background:#fff;text-align:left;font-family:inherit;transition:.15s;box-shadow:0 2px 6px rgba(15,23,42,.04),0 6px 16px -6px rgba(6,182,212,.12);position:relative;overflow:hidden}
  .option::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#06b6d4,#0ea5e9);opacity:0;transition:.15s;border-radius:4px 0 0 4px}
  .option:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,.06),0 10px 24px -8px rgba(6,182,212,.2)}
  .option:hover::before{opacity:1}
  .option:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .option.selected{border-color:#06b6d4;background:linear-gradient(135deg,#ecfeff,#f0fbff);color:#0891b2;box-shadow:0 4px 10px rgba(6,182,212,.15),0 10px 24px -8px rgba(6,182,212,.3)}
  .option.selected::before{opacity:1}
  .option.correct{border-color:#22c55e;background:linear-gradient(135deg,#f0fdf4,#dcfce7);color:#15803d;box-shadow:0 4px 10px rgba(34,197,94,.15),0 10px 24px -8px rgba(34,197,94,.3)}
  .option.correct::before{background:#22c55e;opacity:1}
  .option.wrong{border-color:#ef4444;background:linear-gradient(135deg,#fef2f2,#fee2e2);color:#b91c1c;box-shadow:0 4px 10px rgba(239,68,68,.15),0 10px 24px -8px rgba(239,68,68,.3)}
  .option.wrong::before{background:#ef4444;opacity:1}
  .option.disabled{pointer-events:none}

  /* Footer / button */
  .footer{margin-top:auto;padding-top:18px;display:flex;justify-content:flex-end;align-items:center;gap:16px;border-top:1px solid rgba(6,182,212,.08);flex-shrink:0}
  .feedback{font-weight:900;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:6px}
  .feedback.ok{color:#22c55e}
  .feedback.bad{color:#ef4444}
  .btn{padding:18px 38px;border:none;border-radius:18px;font-size:14px;font-weight:900;letter-spacing:1.2px;cursor:pointer;color:#fff;background:linear-gradient(160deg,#22d3ee,#0891b2);box-shadow:0 6px 16px rgba(6,182,212,.35),0 3px 0 #0e7490 inset,0 -2px 0 rgba(255,255,255,.25) inset;font-family:inherit;transition:.12s;position:relative;overflow:hidden}
  .btn::after{content:'';position:absolute;top:4px;left:8px;right:8px;height:6px;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:50%;pointer-events:none}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 8px rgba(6,182,212,.35),0 1px 0 #0e7490 inset,0 -1px 0 rgba(255,255,255,.25) inset}
  .btn:disabled{background:#e2e8f0;color:#94a3b8;box-shadow:0 2px 4px rgba(15,23,42,.05);cursor:not-allowed;transform:none}
  .btn:disabled::after{opacity:.3}
  .btn.wrong{background:linear-gradient(160deg,#f87171,#dc2626);box-shadow:0 6px 16px rgba(239,68,68,.35),0 3px 0 #991b1b inset,0 -2px 0 rgba(255,255,255,.2) inset}
  .btn.correct{background:linear-gradient(160deg,#4ade80,#16a34a);box-shadow:0 6px 16px rgba(34,197,94,.35),0 3px 0 #15803d inset,0 -2px 0 rgba(255,255,255,.25) inset}

  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .shake{animation:shake .5s cubic-bezier(.4,0,.6,1)}

  /* Mic */
  .mic-btn{width:120px;height:120px;border-radius:50%;border:none;background:linear-gradient(160deg,#fbbf24,#f59e0b);color:#fff;cursor:pointer;transition:.12s;box-shadow:0 8px 20px rgba(245,158,11,.4),0 4px 0 #b45309 inset,0 -4px 0 rgba(255,255,255,.3) inset;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .mic-btn::after{content:'';position:absolute;top:10px;left:16px;right:16px;height:22px;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);border-radius:50% 50% 40% 40%;pointer-events:none}
  .mic-btn:active{transform:translateY(4px);box-shadow:0 4px 10px rgba(245,158,11,.4),0 2px 0 #b45309 inset,0 -2px 0 rgba(255,255,255,.3) inset}
  .mic-btn.listening{background:linear-gradient(160deg,#f87171,#dc2626);box-shadow:0 8px 20px rgba(239,68,68,.5),0 4px 0 #991b1b inset,0 -4px 0 rgba(255,255,255,.2) inset;animation:pulse 1.1s infinite}
  .mic-btn.listening::after{opacity:.5}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .mic-row{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:24px}
  .mic-status{font-size:14px;color:#64748b;font-weight:700;text-align:center;min-height:20px}
  .mic-heard{font-size:18px;font-weight:900;color:#0f172a;text-align:center;min-height:24px;letter-spacing:-.2px}

  /* Dictionary */
  .dict{display:none;flex-direction:column;flex:1;padding:22px 22px calc(env(safe-area-inset-bottom) + 20px);overflow:hidden;background:linear-gradient(180deg,#f0fbff 0%,#ffffff 40%)}
  .dict.active{display:flex}
  .dict h1{font-size:28px;font-weight:900;margin-bottom:5px;letter-spacing:-.5px}
  .dict .sub{color:#64748b;font-weight:600;margin-bottom:18px;font-size:13px}
  .search{width:100%;padding:17px 20px;border:1px solid rgba(6,182,212,.15);border-radius:18px;font-size:16px;font-weight:600;color:#0f172a;outline:none;background:#fff;font-family:inherit;transition:.2s;box-shadow:0 2px 6px rgba(15,23,42,.04),0 6px 16px -6px rgba(6,182,212,.12)}
  .search:focus{border-color:#06b6d4;box-shadow:0 4px 10px rgba(6,182,212,.1),0 0 0 4px rgba(6,182,212,.1)}
  .dict-status{font-size:12px;color:#94a3b8;font-weight:700;margin:12px 2px 10px;min-height:16px}
  .dict-list{margin-top:4px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .dict-item{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid rgba(6,182,212,.1);border-radius:18px;margin-bottom:10px;background:#fff;animation:fadein .3s ease;box-shadow:0 2px 6px rgba(15,23,42,.04),0 6px 16px -6px rgba(6,182,212,.12)}
  .dict-audio{width:44px;height:44px;border-radius:14px;border:none;color:#fff;cursor:pointer;flex-shrink:0;transition:.12s;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .dict-audio::after{content:'';position:absolute;top:3px;left:5px;right:5px;height:7px;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);border-radius:50%;pointer-events:none}
  .dict-audio.en{background:linear-gradient(160deg,#22d3ee,#0891b2);box-shadow:0 3px 8px rgba(6,182,212,.3),0 2px 0 #0e7490 inset}
  .dict-audio.uk{background:linear-gradient(160deg,#fbbf24,#f59e0b);box-shadow:0 3px 8px rgba(245,158,11,.3),0 2px 0 #b45309 inset}
  .dict-audio:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(6,182,212,.3),0 1px 0 #0e7490 inset}
  .dict-en{font-size:15px;font-weight:800;flex:1;color:#0f172a}
  .dict-uk{font-size:14px;font-weight:600;color:#64748b;flex:1;text-align:right}

  /* Complete */
  .complete{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px 24px;gap:10px;animation:fadein .4s ease;position:relative;overflow:hidden;background:linear-gradient(180deg,#f0fbff,#ffffff)}
  .complete::before{content:'';position:absolute;top:10%;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(6,182,212,.15),transparent 60%);border-radius:50%;pointer-events:none}
  .complete.active{display:flex}
  .complete .emoji-icon{color:#06b6d4;margin-bottom:8px;filter:drop-shadow(0 8px 16px rgba(6,182,212,.25));position:relative}
  .complete h1{font-size:32px;background:linear-gradient(135deg,#06b6d4,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;margin-top:6px;letter-spacing:-.5px}
  .complete p{font-size:15px;color:#64748b;font-weight:600}
  .complete .stats{display:flex;gap:22px;margin:26px 0 30px;font-weight:800;color:#475569;font-size:15px;position:relative}
  .complete .stats span{display:flex;align-items:center;gap:6px;background:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 2px 8px rgba(15,23,42,.06),0 6px 16px -6px rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.1)}

  /* Settings modal */
  .settings{display:none;position:absolute;inset:0;background:rgba(15,23,42,.55);z-index:50;align-items:center;justify-content:center;padding:20px;animation:fadein .2s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .settings.active{display:flex}
  .settings-panel{background:#fff;border-radius:26px;padding:26px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto;animation:slideup .3s cubic-bezier(.2,.9,.4,1.1);box-shadow:0 20px 60px rgba(15,23,42,.25),0 4px 12px rgba(15,23,42,.15)}
  @keyframes slideup{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .settings-panel h2{font-size:22px;font-weight:900;margin-bottom:20px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
  .settings-panel label{display:block;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:1.2px;margin:18px 0 8px}
  .settings-panel select{width:100%;padding:15px 18px;border:1px solid rgba(6,182,212,.15);border-radius:16px;font-size:15px;font-weight:700;color:#0f172a;background:#fff;font-family:inherit;transition:.15s;box-shadow:0 2px 6px rgba(15,23,42,.04);-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 18px center;padding-right:44px}
  .settings-panel select:focus{border-color:#06b6d4;outline:none;box-shadow:0 4px 10px rgba(6,182,212,.1),0 0 0 4px rgba(6,182,212,.1)}
  .settings-panel .close{width:100%;padding:17px;margin-top:24px;border:none;border-radius:16px;background:linear-gradient(160deg,#22d3ee,#0891b2);color:#fff;font-weight:900;font-size:14px;letter-spacing:1.2px;cursor:pointer;font-family:inherit;transition:.12s;box-shadow:0 5px 14px rgba(6,182,212,.35),0 3px 0 #0e7490 inset,0 -2px 0 rgba(255,255,255,.25) inset;position:relative;overflow:hidden}
  .settings-panel .close::after{content:'';position:absolute;top:4px;left:8px;right:8px;height:6px;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:50%;pointer-events:none}
  .settings-panel .close:active{transform:translateY(3px);box-shadow:0 2px 6px rgba(6,182,212,.35),0 1px 0 #0e7490 inset,0 -1px 0 rgba(255,255,255,.25) inset}

  /* Dev panel */
  .dev-panel{background:#fff;border-radius:26px;padding:26px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto;animation:slideup .3s cubic-bezier(.2,.9,.4,1.1);box-shadow:0 20px 60px rgba(15,23,42,.25)}
  .dev-panel h2{font-size:22px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
  .dev-panel .sub{font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:18px}
  .dev-panel label{display:block;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:1.2px;margin:18px 0 8px}
  .dev-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .dev-chip{padding:12px 18px;border:1px solid rgba(6,182,212,.15);border-radius:14px;background:#fff;color:#0f172a;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:.12s;box-shadow:0 2px 6px rgba(15,23,42,.04)}
  .dev-chip:hover{border-color:#06b6d4;background:#ecfeff;color:#0891b2;transform:translateY(-1px);box-shadow:0 4px 10px rgba(6,182,212,.15)}
  .dev-chip:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .dev-input{flex:1;padding:14px 16px;border:1px solid rgba(6,182,212,.15);border-radius:14px;font-size:15px;font-weight:700;color:#0f172a;font-family:inherit;outline:none;min-width:0;background:#fff;box-shadow:0 2px 6px rgba(15,23,42,.04)}

var CACHE_KEY = 'learny_cache_v4';
var transCache = {};
function loadCache(){ try{ var r=localStorage.getItem(CACHE_KEY); if(r) transCache=JSON.parse(r); }catch(e){ transCache={}; } }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(transCache)); }catch(e){} }

function cleanTranslation(s){
  if(!s) return '';
  var t = String(s);
  t = t.replace(/&#(\d+);/g, function(m, n){ try{ return String.fromCharCode(parseInt(n,10)); }catch(e){ return ' '; } });
  t = t.replace(/&#x([0-9a-f]+);/gi, function(m, n){ try{ return String.fromCharCode(parseInt(n,16)); }catch(e){ return ' '; } });
  t = t.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&apos;/g,"'").replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  t = t.replace(/[\r\n\t]+/g,' ');
  t = t.trim();
  t = t.replace(/^[\s"'«»\.\,\!\?\:\;]+/,'').replace(/[\s"'«»\.\,\!\?\:\;]+$/,'');
  t = t.trim();
  t = t.replace(/\s{2,}/g,' ');
  return t;
}

function isValidTranslation(input, output, targetLang){
  if(!output) return false;
  var t = output.trim().toLowerCase();
  var inp = input.trim().toLowerCase();
  if(t === inp) return false;
  if(t.length === 0 || t.length > 200) return false;
  if(/error|failed|not found|unavailable|limit/i.test(t)) return false;
  if(targetLang === 'uk'){ if(!/[а-яіїєґ]/i.test(t)) return false; }
  else if(targetLang === 'en'){ if(!/[a-z]/i.test(t)) return false; }
  return true;
}

function translateLingva(text, from, to, callback){
  var url = 'https://lingva.ml/api/v1/' + from + '/' + to + '/' + encodeURIComponent(text);
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 8000;
  xhr.onload = function(){
    if(xhr.status === 200){ try{ var r=JSON.parse(xhr.responseText); if(r && r.translation){ callback(r.translation); return; } }catch(e){} }
    callback(null);
  };
  xhr.onerror = function(){ callback(null); };
  xhr.ontimeout = function(){ callback(null); };
  xhr.send();
}

function translateMyMemory(text, from, to, callback){
  var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 8000;
  xhr.onload = function(){
    if(xhr.status === 200){ try{ var r=JSON.parse(xhr.responseText); var t=r && r.responseData && r.responseData.translatedText; if(t){ callback(t); return; } }catch(e){} }
    callback(null);
  };
  xhr.onerror = function(){ callback(null); };
  xhr.ontimeout = function(){ callback(null); };
  xhr.send();
}

function translate(text, from, to, callback){
  var key = from + '|' + to + '|' + text.toLowerCase();
  if(transCache[key]){ callback(transCache[key], true); return; }
  translateLingva(text, from, to, function(raw){
    var clean = cleanTranslation(raw || '');
    if(raw && isValidTranslation(text, clean, to)){
      transCache[key] = clean; saveCache(); callback(clean, false); return;
    }
    translateMyMemory(text, from, to, function(raw2){
      var clean2 = cleanTranslation(raw2 || '');
      if(raw2 && isValidTranslation(text, clean2, to)){
        transCache[key] = clean2; saveCache(); callback(clean2, false); return;
      }
      callback(null, false);
    });
  });
}

function speak(text, lang){
  try {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var tg = (lang || 'en').toLowerCase();
    u.lang = tg === 'uk' ? 'uk-UA' : 'en-US';
    u.rate = 0.9; u.pitch = 1.0;
    var voices = window.speechSynthesis.getVoices() || [];
    var preferred = tg === 'uk' ? 'Lesya' : 'Samantha';
    var chosen = null;
    for(var i=0;i<voices.length;i++){ if(voices[i].name && voices[i].name.indexOf(preferred) === 0){ chosen = voices[i]; break; } }
    if(!chosen){ for(var j=0;j<voices.length;j++){ var v=voices[j]; if(v.lang && v.lang.toLowerCase().indexOf(tg) === 0){ chosen = v; break; } } }
    if(chosen) u.voice = chosen;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function phonetize(word){
  var s = String(word || '').toLowerCase().trim();
  s = s.replace(/[^a-z]/g, '');
  s = s.replace(/ph/g, 'f');
  s = s.replace(/th/g, 't');
  s = s.replace(/ck/g, 'k');
  s = s.replace(/c(?=[eiy])/g, 's');
  s = s.replace(/c/g, 'k');
  s = s.replace(/w/g, 'v');
  s = s.replace(/q/g, 'k');
  s = s.replace(/x/g, 'ks');
  s = s.replace(/y/g, 'i');
  s = s.replace(/ee/g, 'i');
  s = s.replace(/ea/g, 'i');
  s = s.replace(/oo/g, 'u');
  s = s.replace(/ou/g, 'u');
  s = s.replace(/(.)\1+/g, '$1');
  s = s.replace(/e$/, '');
  s = s.replace(/([bcdfgklmnprstvz])h/g, '$1');
  return s;
}
function levenshtein(a, b){
  var m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  var d=[]; for(var i=0;i<=m;i++){ d[i]=[i]; } for(var j=0;j<=n;j++){ d[0][j]=j; }
  for(var i2=1;i2<=m;i2++){ for(var j2=1;j2<=n;j2++){ var cost = a[i2-1]===b[j2-1]?0:1; d[i2][j2]=Math.min(d[i2-1][j2]+1,d[i2][j2-1]+1,d[i2-1][j2-1]+cost); } }
  return d[m][n];
}
function phoneticallyEqual(a, b){
  var pa = phonetize(a), pb = phonetize(b);
  if(!pa || !pb) return false;
  if(pa === pb) return true;
  return levenshtein(pa, pb) <= 1;
}

var STATE_KEY = 'learny_v1';

function loadState(){

      var p = JSON.parse(raw);

      if(p.prefs) for(var k2 in p.prefs) prefs[k2] = p.prefs[k2];
    }
  } catch(e){}
}

var currentLesson = null;
var currentLessonIndex = -1;
var qIndex = 0;
var selected = null;
var checked = false;
var voiceRetries = 0;

function startLesson(index){
  currentLessonIndex = index;
  currentLesson = THEMES[index];
  qIndex = 0; selected = null; checked = false; voiceRetries = 0;
  elHome.style.display='none'; elDict.classList.remove('active'); elComplete.classList.remove('active'); elLesson.classList.add('active');
  
  buildQuestions(currentLesson.words);
  renderQuestion();
}

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function buildQuestions(pairs){
  var pool = shuffle(pairs).slice(0, Math.min(9, pairs.length));
  var qs = [];
  for(var w=0;w<Math.min(4, pool.length);w++){
    var en = pool[w].en, uk = pool[w].uk;
    var otherUk = []; for(var a=0;a<pool.length;a++){ if(a !== w && pool[a].uk !== uk) otherUk.push(pool[a].uk); }
    otherUk = shuffle(otherUk).slice(0,3);
    if(otherUk.length === 3){ qs.push({ type:'mc', q: prefs.uiLang === 'uk' ? 'Що означає "' + en + '"?' : 'What does "' + en + '" mean?', options: shuffle([uk].concat(otherUk)), answerText: uk }); }
    var otherEn = []; for(var b=0;b<pool.length;b++){ if(b !== w && pool[b].en !== en) otherEn.push(pool[b].en); }
    otherEn = shuffle(otherEn).slice(0,3);
    if(otherEn.length === 3){ qs.push({ type:'mc', q: prefs.uiLang === 'uk' ? 'Яке слово означає "' + uk + '"?' : 'Which word means "' + uk + '"?', options: shuffle([en].concat(otherEn)), answerText: en }); }
  }
  var voiceWords = shuffle(pool.slice(4)).slice(0,4);
  for(var v=0;v<voiceWords.length;v++){
    var vEn = voiceWords[v].en;
    var others = []; for(var c=0;c<pairs.length;c++){ if(pairs[c].en !== vEn) others.push(pairs[c].en); }
    others = shuffle(others).slice(0,3);
    if(others.length === 3){ qs.push({ type:'voice', q:t('listenPick'), speak:vEn, speakLang:'en', options:shuffle([vEn].concat(others)), answerText:vEn }); }
  }
  var readWords = shuffle(pool).slice(0,4);
  for(var r=0;r<readWords.length;r++){
    var rEn = readWords[r].en, rUk = readWords[r].uk;
    var others2 = []; for(var d=0;d<pairs.length;d++){ if(pairs[d].uk !== rUk) others2.push(pairs[d].uk); }
    others2 = shuffle(others2).slice(0,3);
    if(others2.length === 3){ qs.push({ type:'reading', q:t('readPick'), phrase:rEn, options:shuffle([rUk].concat(others2)), answerText:rUk }); }
  }
  var speakWords = shuffle(pool).slice(0,2);
  for(var s=0;s<speakWords.length;s++){ qs.push({ type:'speaking', q:t('sayWord'), speakWord:speakWords[s].en, answerText:speakWords[s].en }); }
  currentLesson.questions = shuffle(qs);
}

function renderQuestion(){
  var q = currentLesson.questions[qIndex];
  document.getElementById('lessonProgress').style.width = ((qIndex + 1) / currentLesson.questions.length * 100) + '%';
  var area = document.getElementById('questionArea');
  area.innerHTML = '';
  voiceRetries = 0;

  if(q.type === 'voice'){
    var srow = document.createElement('div'); srow.className = 'speaker-row';
    var spk = document.createElement('button'); spk.className = 'speaker-btn';
    spk.innerHTML = '<svg class="icon icon-xl"><use href="#i-speaker"/></svg>';
    spk.onclick = function(){ speak(q.speak, q.speakLang || 'en'); };
    srow.appendChild(spk); area.appendChild(srow);
    setTimeout(function(){ speak(q.speak, q.speakLang || 'en'); }, 350);
  }
  if(q.type === 'reading'){
    var prow = document.createElement('div'); prow.className = 'speaker-row';
    var pspk = document.createElement('button'); pspk.className = 'speaker-btn';
    pspk.innerHTML = '<svg class="icon icon-xl"><use href="#i-speaker"/></svg>';
    pspk.onclick = function(){ speak(q.phrase, 'en'); };
    prow.appendChild(pspk); area.appendChild(prow);
  }
  if(q.type === 'speaking'){
    var mrow = document.createElement('div'); mrow.className = 'mic-row';
    var wordDiv = document.createElement('div');
    wordDiv.style.fontSize = '38px'; wordDiv.style.fontWeight = '900';
    wordDiv.style.color = '#0f172a'; wordDiv.style.letterSpacing = '1.5px';
    wordDiv.style.textShadow = '0 2px 4px rgba(6,182,212,.15)';
    wordDiv.textContent = q.speakWord;
    mrow.appendChild(wordDiv);
    var hearBtn = document.createElement('button'); hearBtn.className = 'speaker-btn';
    hearBtn.style.width = '74px'; hearBtn.style.height = '74px';
    hearBtn.innerHTML = '<svg class="icon icon-lg"><use href="#i-speaker"/></svg>';
    hearBtn.onclick = function(){ speak(q.speakWord, 'en'); };
    mrow.appendChild(hearBtn);
    var mic = document.createElement('button'); mic.className = 'mic-btn'; mic.id = 'micBtn';
    mic.innerHTML = '<svg class="icon icon-xl"><use href="#i-mic"/></svg>';
    mic.onclick = function(){ startListening(q); };
    mrow.appendChild(mic);
    var status = document.createElement('div'); status.className = 'mic-status'; status.id = 'micStatus'; status.textContent = t('tapToSpeak'); mrow.appendChild(status);
    var heard = document.createElement('div'); heard.className = 'mic-heard'; heard.id = 'micHeard'; mrow.appendChild(heard);
    area.appendChild(mrow);
  }

  var qt = document.createElement('div');
  qt.className = 'question' + (q.type === 'voice' || q.type === 'reading' ? ' small' : '');
  if(q.type === 'speaking') qt.style.display = 'none';
  qt.id = 'questionText'; qt.textContent = q.q;
  area.appendChild(qt);

  if(q.options && q.options.length){
    var box = document.createElement('div'); box.className = 'options'; box.id = 'optionsBox';
    for(var i=0;i<q.options.length;i++){
      var opt = document.createElement('button'); opt.className = 'option'; opt.textContent = q.options[i];
      (function(txt, el){ el.onclick = function(){ selectOption(txt, el); }; })(q.options[i], opt);
      box.appendChild(opt);
    }
    area.appendChild(box);
  }

  document.getElementById('feedback').innerHTML = '';
  document.getElementById('feedback').className = 'feedback';
  var btn = document.getElementById('mainBtn');
  btn.textContent = t('check');
  btn.disabled = (q.type !== 'speaking');
  btn.className = 'btn';
  selected = null; checked = false;
}

function selectOption(text, el){
  if(checked) return;
  selected = text;
  var opts = document.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('selected');
  el.classList.add('selected');
  document.getElementById('mainBtn').disabled = false;
}

function startListening(q){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('micStatus').textContent = t('notSupported');
    setTimeout(function(){ handleSpeakingSuccess(q, '(пропущено)'); }, 2000);
    return;
  }
  var rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  var mic = document.getElementById('micBtn');
  var status = document.getElementById('micStatus');
  var heard = document.getElementById('micHeard');
  mic.classList.add('listening');
  status.textContent = t('listening');
  heard.textContent = '';
  var finished = false;
  rec.onresult = function(event){
    if(finished) return; finished = true;
    mic.classList.remove('listening');
    var results = event.results[0];
    var all = []; for(var i=0;i<results.length;i++){ all.push(results[i].transcript.trim().toLowerCase()); }
    heard.textContent = t('youSaid') + ' "' + all[0] + '"';
    var matched = false;
    for(var a=0;a<all.length;a++){ if(phoneticallyEqual(all[a], q.speakWord)){ matched = true; break; } }
    if(matched){ handleSpeakingSuccess(q, all[0]); }
    else {
      voiceRetries++;
      if(voiceRetries >= 3){
        status.textContent = 'Правильно: ' + q.speakWord;
        setTimeout(function(){ handleSpeakingSuccess(q, all[0] || '(—)'); }, 1200);
      } else {
        status.textContent = t('tryAgain') + ' (' + (3 - voiceRetries) + ')';
        var fb = document.getElementById('feedback');
        fb.innerHTML = '<svg class="icon" style="color:#ef4444"><use href="#i-x-circle"/></svg> ' + t('wrong');
        fb.className = 'feedback bad';
      }
    }
  };
  rec.onerror = function(){ if(finished) return; finished = true; mic.classList.remove('listening'); status.textContent = t('tryAgain'); voiceRetries++; if(voiceRetries >= 3){ setTimeout(function(){ handleSpeakingSuccess(q, '(помилка)'); }, 800); } };
  rec.onend = function(){ if(finished) return; finished = true; mic.classList.remove('listening'); if(!document.getElementById('micHeard').textContent){ status.textContent = t('tryAgain'); voiceRetries++; if(voiceRetries >= 3){ setTimeout(function(){ handleSpeakingSuccess(q, '(тиша)'); }, 800); } } };
  try { rec.start(); } catch(e){ mic.classList.remove('listening'); status.textContent = t('tryAgain'); }
}

function handleSpeakingSuccess(q, heardText){
  var fb = document.getElementById('feedback');
  fb.innerHTML = '<svg class="icon" style="color:#22c55e"><use href="#i-check"/></svg> ' + t('correct');
  fb.className = 'feedback ok';
  var btn = document.getElementById('mainBtn');
  btn.className = 'btn correct'; btn.textContent = t('cont'); btn.disabled = false;
  checked = true;
}

function handleMainBtn(){
  var q = currentLesson.questions[qIndex];
  if(q.type === 'speaking'){ if(checked){ advanceQuestion(); } return; }
  if(!checked){
    checked = true;
    var correct = (selected === q.answerText);
    var opts = document.querySelectorAll('.option');
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add('disabled');
      if(opts[i].textContent === q.answerText) opts[i].classList.add('correct');
      else if(opts[i].textContent === selected) opts[i].classList.add('wrong');
    }
    var fb = document.getElementById('feedback');
    var btn = document.getElementById('mainBtn');
    if(correct){ 
      fb.innerHTML = '<svg class="icon" style="color:#22c55e"><use href="#i-check"/></svg> ' + t('correct'); 
      fb.className = 'feedback ok'; btn.className = 'btn correct'; 
    }
    else {
      fb.innerHTML = '<svg class="icon" style="color:#ef4444"><use href="#i-x-circle"/></svg> ' + t('wrong'); 
      fb.className = 'feedback bad'; btn.className = 'btn wrong';
      var qe = document.getElementById('questionText');
      if(qe){ qe.classList.add('shake'); setTimeout(function(){ qe.classList.remove('shake'); }, 500); }
    }
    btn.textContent = t('cont');
  } else { advanceQuestion(); }
}

function advanceQuestion(){
  if(qIndex < currentLesson.questions.length - 1){ qIndex++; renderQuestion(); }
  else {
    state.completed = Math.max(state.completed, currentLessonIndex + 1);
    var gained = 30 + Math.round(currentLesson.questions.length / 2);
    state.xp += gained; state.gems += 15; saveState();
    var title = prefs.uiLang === 'uk' ? currentLesson.uk : currentLesson.en;
    document.getElementById('completeTitle').textContent = title;
    document.getElementById('xpGained').textContent = gained;
    elLesson.classList.remove('active'); elComplete.classList.add('active');
  }
}

function exitLesson(){ elLesson.classList.remove('active'); showHome(); }
function backHome(){ elComplete.classList.remove('active'); showHome(); }

var dictTimer = null;
var lastQuery = '';
function onDictInput(){
  var q = document.getElementById('dictSearch').value.trim();
  if(q === lastQuery) return;
  lastQuery = q;
  if(dictTimer) clearTimeout(dictTimer);
  if(!q){ document.getElementById('dictList').innerHTML = ''; document.getElementById('dictStatus').textContent = t('dictHint'); return; }
  document.getElementById('dictStatus').textContent = t('loadingShort');
  dictTimer = setTimeout(function(){ lookupWord(q); }, 450);
}
function lookupWord(q){
  var list = document.getElementById('dictList');
  var status = document.getElementById('dictStatus');
  list.innerHTML = '';
  var isCyrillic = /[а-яіїєґ]/i.test(q);
  var from = isCyrillic ? 'uk' : 'en';
  var to = isCyrillic ? 'en' : 'uk';
  translate(q, from, to, function(result, fromCache){
    if(!result){ status.textContent = t('emptyDict'); return; }
    status.textContent = fromCache ? t('dictCache') : t('dictOnline');
    var en = from === 'en' ? q : result;
    var uk = from === 'uk' ? q : result;
    renderDictItem(en, uk, fromCache);
  });
}
function renderDictItem(en, uk, fromCache){
  var list = document.getElementById('dictList'); list.innerHTML = '';
  var row = document.createElement('div'); row.className = 'dict-item';
  var spkEn = document.createElement('button'); spkEn.className = 'dict-audio en'; 
  spkEn.innerHTML = '<svg class="icon"><use href="#i-speaker"/></svg>';
  spkEn.onclick = function(){ speak(en, 'en'); };
  var spkUk = document.createElement('button'); spkUk.className = 'dict-audio uk'; 
  spkUk.innerHTML = '<svg class="icon"><use href="#i-speaker"/></svg>';
  spkUk.onclick = function(){ speak(uk, 'uk'); };
  var enDiv = document.createElement('div'); enDiv.className = 'dict-en'; enDiv.textContent = en;
  var ukDiv = document.createElement('div'); ukDiv.className = 'dict-uk'; ukDiv.textContent = uk;
  row.appendChild(spkEn); row.appendChild(enDiv); row.appendChild(ukDiv); row.appendChild(spkUk);
  list.appendChild(row);
}
