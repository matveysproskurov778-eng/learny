<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learny">
<meta name="theme-color" content="#06b6d4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<title>Learny</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#fff;color:#0f172a;display:flex;flex-direction:column;user-select:none}
  .topbar{background:linear-gradient(135deg,#06b6d4 0%,#0ea5e9 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 3px 14px rgba(6,182,212,.28)}
  .logo{font-weight:900;font-size:18px;letter-spacing:-.3px;flex-shrink:0;display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-user-select:none;user-select:none}
  .logo .snake{font-size:22px;transform:scaleX(-1)}
  .pills{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
  .pill{background:rgba(255,255,255,.22);padding:5px 10px;border-radius:30px;font-weight:800;font-size:12px;white-space:nowrap;backdrop-filter:blur(6px)}
  .iconbtn{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:.15s}
  .iconbtn:active{background:rgba(255,255,255,.4);transform:scale(.92)}
  .iconbtn.hidden{display:none}
  .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
  .hero{padding:18px 22px 16px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#ecfeff 0%,#ffffff 100%);border-bottom:1px solid #e0f7fa}
  .hero-flag{font-size:44px}
  .hero h1{font-size:22px;font-weight:900;color:#0f172a}
  .hero p{color:#64748b;font-weight:600;margin-top:2px;font-size:13px}
  .hero-xp{margin-left:auto;text-align:right}
  .hero-xp .big{font-size:26px;font-weight:900;color:#06b6d4}
  .hero-xp .lbl{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:1px}
  .lessons{padding:16px 18px 10px;display:flex;flex-direction:column;gap:10px}
  .lesson-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid #e0f7fa;border-bottom-width:4px;border-radius:18px;background:#fff;cursor:pointer;transition:.12s;text-align:left;font-family:inherit;width:100%}
  .lesson-card:hover{background:#f0fdff;border-color:#a5f3fc}
  .lesson-card:active{transform:translateY(2px);border-bottom-width:2px}
  .lesson-card.done{border-color:#06b6d4;background:linear-gradient(135deg,#ecfeff,#f0fdff)}
  .lesson-card.locked{opacity:.55;cursor:not-allowed;background:#f8fafc;border-color:#e2e8f0}
  .lesson-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#fff;box-shadow:0 3px 0 #0891b2}
  .lesson-icon.done{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 3px 0 #15803d}
  .lesson-icon.locked{background:#cbd5e1;box-shadow:0 3px 0 #94a3b8}
  .lesson-info{flex:1;min-width:0}
  .lesson-info h3{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:2px}
  .lesson-info p{color:#64748b;font-size:12px;font-weight:600}
  .lesson-arrow{color:#94a3b8;font-size:20px;font-weight:700}
  .lesson-view{display:none;flex-direction:column;flex:1;padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden}
  .lesson-view.active{display:flex;animation:slidein .25s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  .lesson-top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-shrink:0}
  .close-btn{font-size:22px;color:#94a3b8;cursor:pointer;font-weight:900;background:none;border:none;padding:0 4px;font-family:inherit;transition:.15s}
  .close-btn:hover{color:#475569}
  .prog-bg{flex:1;height:14px;background:#e2e8f0;border-radius:20px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(90deg,#06b6d4,#0ea5e9);border-radius:20px;transition:width .4s ease;width:0}
  .question-card{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .question{font-size:22px;font-weight:800;margin-bottom:22px;line-height:1.3;color:#0f172a}
  .question.small{font-size:19px}
  .speaker-row{display:flex;justify-content:center;margin-bottom:22px}
  .speaker-btn{width:110px;height:110px;border-radius:50%;border:none;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#fff;font-size:48px;cursor:pointer;box-shadow:0 7px 0 #0891b2;font-family:inherit;transition:.08s}
  .speaker-btn:hover{filter:brightness(1.06)}
  .speaker-btn:active{transform:translateY(4px);box-shadow:0 3px 0 #0891b2}
  .options{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;padding-bottom:6px}
  .option{padding:18px 20px;border:2px solid #e2e8f0;border-bottom-width:5px;border-radius:16px;font-size:17px;font-weight:700;color:#0f172a;cursor:pointer;background:#fff;text-align:left;font-family:inherit;transition:.12s}
  .option:hover{background:#f8fafc;border-color:#cbd5e1}
  .option:active{transform:translateY(2px);border-bottom-width:3px}
  .option.selected{border-color:#06b6d4;background:#ecfeff;color:#0891b2}
  .option.correct{border-color:#22c55e;background:#f0fdf4;color:#15803d}
  .option.wrong{border-color:#ef4444;background:#fef2f2;color:#b91c1c}
  .option.disabled{pointer-events:none}
  .loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#64748b;font-weight:700}
  .loading-spinner{width:52px;height:52px;border-radius:50%;border:4px solid #e2e8f0;border-top-color:#06b6d4;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer{margin-top:auto;padding-top:16px;display:flex;justify-content:flex-end;align-items:center;gap:16px;border-top:2px solid #f1f5f9;flex-shrink:0}
  .feedback{font-weight:900;font-size:17px;margin-right:auto}
  .feedback.ok{color:#22c55e}
  .feedback.bad{color:#ef4444}
  .btn{padding:16px 34px;border:none;border-radius:16px;font-size:14px;font-weight:900;letter-spacing:1px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#06b6d4,#0ea5e9);box-shadow:0 5px 0 #0891b2;font-family:inherit;transition:.08s}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0891b2}
  .btn:disabled{background:#e2e8f0;color:#94a3b8;box-shadow:none;cursor:not-allowed}
  .btn.wrong{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 5px 0 #991b1b}
  .btn.correct{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 5px 0 #15803d}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .shake{animation:shake .45s}
  .mic-btn{width:130px;height:130px;border-radius:50%;border:none;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;font-size:56px;cursor:pointer;box-shadow:0 7px 0 #c2410c;font-family:inherit;transition:.1s}
  .mic-btn:hover{filter:brightness(1.06)}
  .mic-btn:active{transform:translateY(4px);box-shadow:0 3px 0 #c2410c}
  .mic-btn.listening{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 7px 0 #991b1b;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .mic-row{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px}
  .mic-status{font-size:14px;color:#64748b;font-weight:700;text-align:center;min-height:20px}
  .mic-heard{font-size:18px;font-weight:900;color:#0f172a;text-align:center;min-height:24px}
  .dict{display:none;flex-direction:column;flex:1;padding:18px 22px calc(env(safe-area-inset-bottom) + 20px);overflow:hidden}
  .dict.active{display:flex}
  .dict h1{font-size:26px;font-weight:900;margin-bottom:4px}
  .dict .sub{color:#64748b;font-weight:600;margin-bottom:16px;font-size:13px}
  .search{width:100%;padding:15px 18px;border:2px solid #e2e8f0;border-bottom-width:5px;border-radius:16px;font-size:16px;font-weight:600;color:#0f172a;outline:none;background:#f8fafc;font-family:inherit;transition:.15s}
  .search:focus{border-color:#06b6d4;background:#fff;box-shadow:0 0 0 4px rgba(6,182,212,.1)}
  .dict-status{font-size:12px;color:#94a3b8;font-weight:700;margin:10px 2px 8px;min-height:16px}
  .dict-list{margin-top:4px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .dict-item{display:flex;align-items:center;gap:10px;padding:14px 16px;border:2px solid #f1f5f9;border-bottom-width:4px;border-radius:14px;margin-bottom:8px;background:#fff;animation:fadein .25s ease}
  .dict-audio{width:40px;height:40px;border-radius:50%;border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;font-family:inherit;transition:.08s;display:flex;align-items:center;justify-content:center}
  .dict-audio.en{background:linear-gradient(135deg,#06b6d4,#0ea5e9);box-shadow:0 3px 0 #0891b2}
  .dict-audio.uk{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 3px 0 #c2410c}
  .dict-audio:active{transform:translateY(2px);box-shadow:0 1px 0 #0891b2}
  .dict-en{font-size:15px;font-weight:800;flex:1;color:#0f172a}
  .dict-uk{font-size:14px;font-weight:600;color:#64748b;flex:1;text-align:right}
  .dict-badge{font-size:10px;font-weight:800;letter-spacing:.5px;background:#ecfeff;color:#0891b2;padding:3px 7px;border-radius:8px;margin-left:6px}
  .complete{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px 24px;gap:8px;animation:fadein .35s ease}
  .complete.active{display:flex}
  .complete .emoji{font-size:64px;margin-bottom:6px}
  .complete h1{font-size:30px;background:linear-gradient(135deg,#06b6d4,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900;margin-top:4px}
  .complete p{font-size:15px;color:#64748b;font-weight:600}
  .complete .stats{display:flex;gap:20px;margin:22px 0 26px;font-weight:800;color:#475569;font-size:15px}
  .complete .stats span{display:flex;align-items:center;gap:6px}
  .settings{display:none;position:absolute;inset:0;background:rgba(15,23,42,.5);z-index:50;align-items:center;justify-content:center;padding:20px;animation:fadein .2s ease}
  .settings.active{display:flex}
  .settings-panel{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;animation:slideup .25s ease}
  @keyframes slideup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .settings-panel h2{font-size:20px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .settings-panel label{display:block;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:1px;margin:14px 0 6px}
  .settings-panel select{width:100%;padding:13px 15px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;font-weight:700;color:#0f172a;background:#f8fafc;font-family:inherit;transition:.15s}
  .settings-panel select:focus{border-color:#06b6d4;outline:none}
  .settings-panel .close{width:100%;padding:15px;margin-top:20px;border:none;border-radius:14px;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#fff;font-weight:900;font-size:14px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 #0891b2;font-family:inherit}
  .settings-panel .close:active{transform:translateY(2px);box-shadow:0 2px 0 #0891b2}
  .settings-panel .note{font-size:11px;color:#94a3b8;margin-top:12px;line-height:1.5}
  .dev-panel{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto;animation:slideup .25s ease}
  .dev-panel h2{font-size:20px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .dev-panel .sub{font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:16px}
  .dev-panel label{display:block;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:1px;margin:14px 0 6px}
  .dev-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .dev-chip{padding:10px 16px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;color:#0f172a;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:.1s}
  .dev-chip:hover{border-color:#06b6d4;background:#ecfeff;color:#0891b2}
  .dev-chip:active{transform:translateY(2px)}
  .dev-input{flex:1;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-weight:700;color:#0f172a;font-family:inherit;outline:none;min-width:0}
  .dev-input:focus{border-color:#06b6d4}
  .dev-btn{width:100%;padding:14px;margin-top:8px;border:none;border-radius:14px;font-weight:900;font-size:14px;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:.08s}
  .dev-btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 0 #991b1b}
  .dev-btn.ghost{background:#fff;color:#64748b;border:2px solid #e2e8f0}
  .dev-status{font-size:12px;font-weight:700;color:#22c55e;text-align:center;margin-top:10px;min-height:16px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo" id="logoBtn"><span class="snake">🐍</span> Learny</div>
  <div class="pills">
    <div class="pill">🔥 <span id="streakVal">1</span></div>
    <div class="pill">💎 <span id="gemVal">50</span></div>
    <div class="pill">⚡ <span id="xpVal">0</span></div>
  </div>
  <button class="iconbtn hidden" id="devBtn" onclick="openDevPanel()">🔧</button>
  <button class="iconbtn" onclick="toggleSettings()">⚙️</button>
</div>

<div id="homeView" class="main">
  <div class="hero">
    <div class="hero-flag" id="heroFlag">🇬🇧</div>
    <div>
      <h1 id="heroTitle">Англійська</h1>
      <p id="heroSub">0 / 30 уроків</p>
    </div>
    <div class="hero-xp">
      <div class="big" id="heroXpBig">0</div>
      <div class="lbl">XP</div>
    </div>
  </div>
  <div class="lessons" id="lessonsContainer"></div>
</div>

<div id="lessonView" class="lesson-view">
  <div class="lesson-top">
    <button class="close-btn" onclick="exitLesson()">✕</button>
    <div class="prog-bg"><div class="prog-fill" id="lessonProgress"></div></div>
  </div>
  <div class="question-card" id="questionArea"></div>
  <div class="footer">
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="mainBtn" disabled onclick="handleMainBtn()">ПЕРЕВІРИТИ</button>
  </div>
</div>

<div id="dictView" class="dict">
  <h1>📖 Словник</h1>
  <div class="sub" id="dictSub">Переклад онлайн · 🔊 = англійська · 🟠 = українська</div>
  <input class="search" id="dictSearch" placeholder="Введіть слово..." oninput="onDictInput()">
  <div class="dict-status" id="dictStatus"></div>
  <div class="dict-list" id="dictList"></div>
</div>

<div id="completeView" class="complete">
  <div class="emoji">🎉</div>
  <h1 id="completeH1">Урок завершено!</h1>
  <p id="completeTitle"></p>
  <div class="stats">
    <span>⚡ +<span id="xpGained">50</span> XP</span>
    <span>💎 +15</span>
  </div>
  <button class="btn" onclick="backHome()" id="completeBtn">ПРОДОВЖИТИ</button>
</div>

<div class="settings" id="settingsModal" onclick="if(event.target===this)toggleSettings()">
  <div class="settings-panel">
    <h2>⚙️ Налаштування</h2>
    <label>МОВА ІНТЕРФЕЙСУ</label>
    <select id="uiLangSelect" onchange="setUILang(this.value)">
      <option value="uk">🇺🇦 Українська</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <label>МОВА, ЯКУ ВИВЧАЮ</label>
    <select id="learnLangSelect" onchange="setLearnLang(this.value)">
      <option value="en">🇬🇧 Англійська</option>
      <option value="uk">🇺🇦 Українська</option>
    </select>
    <div class="note">Озвучення: Samantha (англійська) + Lesya (українська). Переклад через Lingva + MyMemory.</div>
    <button class="close" onclick="toggleSettings()">ЗАКРИТИ</button>
  </div>
</div>

<div class="settings" id="devModal" onclick="if(event.target===this)closeDevPanel()">
  <div class="dev-panel">
    <h2>🔧 Dev Tools</h2>
    <div class="sub">Тільки для розробника</div>
    <label>РОЗБЛОКУВАТИ ДО УРОКУ</label>
    <div class="dev-row" id="unlockChips"></div>
    <div class="dev-row">
      <input class="dev-input" id="customUnlock" type="number" min="0" max="30" placeholder="Свій номер">
      <button class="dev-chip" onclick="customUnlockClick()">OK</button>
    </div>
    <button class="dev-btn danger" onclick="devReset()">СКИНУТИ ПРОГРЕС</button>
    <button class="dev-btn ghost" onclick="lockDev()">ЗАКРИТИ DEV</button>
    <div class="dev-status" id="devStatus"></div>
  </div>
</div>

<script>
var UI = {
  uk: { lessons:'уроків', check:'ПЕРЕВІРИТИ', cont:'ПРОДОВЖИТИ',
        correct:'✅ Правильно!', wrong:'❌ Не зовсім', complete:'Урок завершено!',
        locked:'Заблоковано', completed:'Пройдено', questions:'питань',
        loading:'Завантаження перекладів...', loadingShort:'Хвилинку...',
        emptyDict:'Нічого не знайдено', dictHint:'Введіть слово англійською або українською',
        dictOnline:'переклад онлайн', dictCache:'з кешу', dictError:'Помилка мережі',
        listenPick:'🎧 Прослухайте та виберіть, що почули:',
        readPick:'📖 Прочитайте та виберіть переклад:',
        sayWord:'🎤 Скажіть це слово:',
        tapToSpeak:'Натисніть і говоріть',
        listening:'Слухаю...',
        youSaid:'Ми почули:',
        tryAgain:'Спробуйте ще',
        notSupported:'Мікрофон не підтримується' },
  en: { lessons:'lessons', check:'CHECK', cont:'CONTINUE',
        correct:'✅ Correct!', wrong:'❌ Not quite', complete:'Lesson complete!',
        locked:'Locked', completed:'Completed', questions:'questions',
        loading:'Loading translations...', loadingShort:'One moment...',
        emptyDict:'Nothing found', dictHint:'Type a word in English or Ukrainian',
        dictOnline:'online translation', dictCache:'from cache', dictError:'Network error',
        listenPick:'🎧 Listen and pick what you heard:',
        readPick:'📖 Read and pick the translation:',
        sayWord:'🎤 Say this word:',
        tapToSpeak:'Tap and speak',
        listening:'Listening...',
        youSaid:'We heard:',
        tryAgain:'Try again',
        notSupported:'Microphone not supported' }
};

var THEMES = [
  { uk:'Привітання',  en:'Greetings',  icon:'👋', words:['hello','hi','good morning','good afternoon','good evening','good night','goodbye','bye','see you','see you later','welcome','thank you','please','sorry','excuse me'] },
  { uk:'Знайомство',  en:'Introductions',  icon:'🤝', words:['my name is','what is your name','nice to meet you','how are you','I am fine','where are you from','I am from Ukraine','I live in','how old are you','I am','this is','my friend','my family','I speak','I do not understand'] },
  { uk:'Числа',  en:'Numbers',  icon:'🔢', words:['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','twenty','one hundred'] },
  { uk:'Кольори',  en:'Colors',  icon:'🎨', words:['red','blue','green','yellow','orange','purple','pink','brown','black','white','grey','light','dark','bright','color'] },
  { uk:'Тварини',  en:'Animals',  icon:'🐶', words:['cat','dog','bird','fish','horse','cow','pig','chicken','sheep','rabbit','mouse','bear','lion','elephant','animal'] },

/* Clean translation text */
function cleanTranslation(s){
  if(!s) return '';
  var t = String(s);
  t = t.replace(/&#(\d+);/g, function(m, n){ try{ return String.fromCharCode(parseInt(n,10)); }catch(e){ return ' '; } });
  t = t.replace(/&#x([0-9a-f]+);/gi, function(m, n){ try{ return String.fromCharCode(parseInt(n,16)); }catch(e){ return ' '; } });
  t = t.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&apos;/g,"'").replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  t = t.replace(/[\r\n\t]+/g,' ');
  t = t.trim();
  t = t.replace(/^[\s"'«»\.\,\!\?\:\;]+/,'').replace(/[\s"'«»\.\,\!\?\:\;]+$/,'');
  t = t.trim();
  t = t.replace(/\s{2,}/g,' ');
  return t;
}

/* Validate a translation: must contain Cyrillic, must differ from input */
function isValidTranslation(input, output, targetLang){
  if(!output) return false;
  var t = output.trim().toLowerCase();
  var inp = input.trim().toLowerCase();
  if(t === inp) return false;
  if(t.length === 0 || t.length > 200) return false;
  /* error message patterns */
  if(/error|failed|not found|unavailable|limit/i.test(t)) return false;
  if(targetLang === 'uk'){
    if(!/[а-яіїєґ]/i.test(t)) return false;
  } else if(targetLang === 'en'){
    if(!/[a-z]/i.test(t)) return false;
  }
  return true;
}

/* Lingva */
function translateLingva(text, from, to, callback){
  var url = 'https://lingva.ml/api/v1/' + from + '/' + to + '/' + encodeURIComponent(text);
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 8000;
  xhr.onload = function(){
    if(xhr.status === 200){
      try { var r = JSON.parse(xhr.responseText); if(r && r.translation){ callback(r.translation); return; } } catch(e){}
    }
    callback(null);
  };
  xhr.onerror = function(){ callback(null); };
  xhr.ontimeout = function(){ callback(null); };
  xhr.send();
}

/* MyMemory */
function translateMyMemory(text, from, to, callback){
  var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 8000;
  xhr.onload = function(){
    if(xhr.status === 200){
      try { var r = JSON.parse(xhr.responseText); var t = r && r.responseData && r.responseData.translatedText; if(t){ callback(t); return; } } catch(e){}
    }
    callback(null);
  };
  xhr.onerror = function(){ callback(null); };
  xhr.ontimeout = function(){ callback(null); };
  xhr.send();
}

function translate(text, from, to, callback){
  var key = from + '|' + to + '|' + text.toLowerCase();
  if(transCache[key]){ callback(transCache[key], true); return; }
  translateLingva(text, from, to, function(raw){
    var clean = cleanTranslation(raw || '');
    if(raw && isValidTranslation(text, clean, to)){
      transCache[key] = clean;
      saveCache();
      callback(clean, false);
      return;
    }
    /* Lingva failed validation → try MyMemory */
    translateMyMemory(text, from, to, function(raw2){
      var clean2 = cleanTranslation(raw2 || '');
      if(raw2 && isValidTranslation(text, clean2, to)){
        transCache[key] = clean2;
        saveCache();
        callback(clean2, false);
        return;
      }
      callback(null, false);
    });
  });
}

function translateBatch(words, callback){
  var results = [];
  var remaining = words.length;
  if(remaining === 0){ callback([], false); return; }
  for(var i=0;i<words.length;i++){
    (function(idx){
      translate(words[idx], 'en', 'uk', function(uk){
        if(uk){ results[idx] = { en: words[idx], uk: uk }; }
        else { results[idx] = null; }
        remaining--;
        if(remaining === 0){ callback(results, false); }
      });
    })(i);
  }
}

/* Speech synthesis */
function speak(text, lang){
  try {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var tg = (lang || 'en').toLowerCase();
    u.lang = tg === 'uk' ? 'uk-UA' : 'en-US';
    u.rate = 0.9;
    u.pitch = 1.0;
    var voices = window.speechSynthesis.getVoices() || [];
    var preferred = tg === 'uk' ? 'Lesya' : 'Samantha';
    var chosen = null;
    for(var i=0;i<voices.length;i++){
      if(voices[i].name && voices[i].name.indexOf(preferred) === 0){ chosen = voices[i]; break; }
    }
    if(!chosen){
      for(var j=0;j<voices.length;j++){
        var v = voices[j];
        if(v.lang && v.lang.toLowerCase().indexOf(tg) === 0){ chosen = v; break; }
      }
    }
    if(chosen) u.voice = chosen;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

/* ============================================================
   PHONETIC FUZZY MATCH for speaking questions
   ============================================================ */
function phonetize(word){
  var s = String(word || '').toLowerCase().trim();
  /* remove non-letters */
  s = s.replace(/[^a-z]/g, '');
  /* common substitutions for accents */
  s = s.replace(/ph/g, 'f');
  s = s.replace(/th/g, 't');
  s = s.replace(/ck/g, 'k');
  s = s.replace(/c(?=[eiy])/g, 's');   /* soft c → s */
  s = s.replace(/c/g, 'k');            /* hard c → k */
  s = s.replace(/w/g, 'v');            /* w → v (common Ukrainian accent) */
  s = s.replace(/q/g, 'k');
  s = s.replace(/x/g, 'ks');
  s = s.replace(/y/g, 'i');
  s = s.replace(/ee/g, 'i');
  s = s.replace(/ea/g, 'i');
  s = s.replace(/oo/g, 'u');
  s = s.replace(/ou/g, 'u');
  /* collapse double letters */
  s = s.replace(/(.)\1+/g, '$1');
  /* drop silent trailing e */
  s = s.replace(/e$/, '');
  /* drop h after consonant */
  s = s.replace(/([bcdfgklmnprstvz])h/g, '$1');
  return s;
}

function phoneticallyEqual(a, b){
  var pa = phonetize(a);
  var pb = phonetize(b);
  if(!pa || !pb) return false;
  if(pa === pb) return true;
  /* allow 1-char edit distance on phonetic form */
  return levenshtein(pa, pb) <= 1;
}

function levenshtein(a, b){
  var m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  var d = [];
  for(var i=0;i<=m;i++){ d[i] = [i]; }
  for(var j=0;j<=n;j++){ d[0][j] = j; }
  for(var i2=1;i2<=m;i2++){
    for(var j2=1;j2<=n;j2++){
      var cost = a[i2-1] === b[j2-1] ? 0 : 1;
      d[i2][j2] = Math.min(d[i2-1][j2]+1, d[i2][j2-1]+1, d[i2-1][j2-1]+cost);
    }
  }
  return d[m][n];
}

function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

function buildQuestions(pairs){
  /* choose 9 random words for the MC portion */
  var pool = shuffle(pairs).slice(0, Math.min(9, pairs.length));
  var qs = [];

  /* 8 MC questions from first 4 words (both directions each) */
  for(var w=0;w<Math.min(4, pool.length);w++){
    var en = pool[w].en;
    var uk = pool[w].uk;
    var otherUk = [];
    for(var a=0;a<pool.length;a++){ if(a !== w && pool[a].uk !== uk) otherUk.push(pool[a].uk); }
    otherUk = shuffle(otherUk).slice(0,3);
    if(otherUk.length === 3){
      qs.push({ type:'mc', q: prefs.uiLang === 'uk' ? 'Що означає "' + en + '"?' : 'What does "' + en + '" mean?', options: shuffle([uk].concat(otherUk)), answerText: uk });
    }
    var otherEn = [];
    for(var b=0;b<pool.length;b++){ if(b !== w && pool[b].en !== en) otherEn.push(pool[b].en); }
    otherEn = shuffle(otherEn).slice(0,3);
    if(otherEn.length === 3){
      qs.push({ type:'mc', q: prefs.uiLang === 'uk' ? 'Яке слово означає "' + uk + '"?' : 'Which word means "' + uk + '"?', options: shuffle([en].concat(otherEn)), answerText: en });
    }
  }

  /* 4 voice questions from words 4-8 */
  var voiceWords = shuffle(pool.slice(4)).slice(0,4);
  for(var v=0;v<voiceWords.length;v++){
    var vEn = voiceWords[v].en;
    var others = [];
    for(var c=0;c<pairs.length;c++){ if(pairs[c].en !== vEn) others.push(pairs[c].en); }
    others = shuffle(others).slice(0,3);
    if(others.length === 3){
      qs.push({ type:'voice', q: t('listenPick'), speak:vEn, speakLang:'en', options: shuffle([vEn].concat(others)), answerText: vEn });
    }
  }

  /* 4 reading questions (EN phrase → pick Ukrainian) */
  var readWords = shuffle(pool).slice(0,4);
  for(var r=0;r<readWords.length;r++){
    var rEn = readWords[r].en;
    var rUk = readWords[r].uk;
    var others2 = [];
    for(var d=0;d<pairs.length;d++){ if(pairs[d].uk !== rUk) others2.push(pairs[d].uk); }
    others2 = shuffle(others2).slice(0,3);
    if(others2.length === 3){
      qs.push({ type:'reading', q: t('readPick'), phrase: rEn, options: shuffle([rUk].concat(others2)), answerText: rUk });
    }
  }

  /* 2 speaking questions */
  var speakWords = shuffle(pool).slice(0,2);
  for(var s=0;s<speakWords.length;s++){
    qs.push({ type:'speaking', q: t('sayWord'), speakWord: speakWords[s].en, answerText: speakWords[s].en });
  }

  currentLesson.questions = shuffle(qs);
}

    box.id = 'optionsBox';
    for(var i=0;i<q.options.length;i++){
      var opt = document.createElement('button');
      opt.className = 'option';
      opt.textContent = q.options[i];
      (function(txt, el){ el.onclick = function(){ selectOption(txt, el); }; })(q.options[i], opt);
      box.appendChild(opt);
    }
    area.appendChild(box);
  }

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  var btn = document.getElementById('mainBtn');
  btn.textContent = t('check');
  btn.disabled = (q.type !== 'speaking');
  btn.className = 'btn';
  selected = null;
  checked = false;
}

function selectOption(text, el){
  if(checked) return;
  selected = text;
  var opts = document.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('selected');
  el.classList.add('selected');
  document.getElementById('mainBtn').disabled = false;
}

/* ============================================================
   SPEECH RECOGNITION for speaking questions
   ============================================================ */
function startListening(q){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('micStatus').textContent = t('notSupported');
    /* fallback: mark as correct after 2 sec */
    setTimeout(function(){ handleSpeakingSuccess(q, '(пропущено)'); }, 2000);
    return;
  }
  var rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.continuous = false;

  var mic = document.getElementById('micBtn');
  var status = document.getElementById('micStatus');
  var heard = document.getElementById('micHeard');

  mic.classList.add('listening');
  status.textContent = t('listening');
  heard.textContent = '';

  var finished = false;

  rec.onresult = function(event){
    if(finished) return;
    finished = true;
    mic.classList.remove('listening');
    var results = event.results[0];
    var all = [];
    for(var i=0;i<results.length;i++){ all.push(results[i].transcript.trim().toLowerCase()); }
    heard.textContent = t('youSaid') + ' "' + all[0] + '"';
    /* check all alternates phonetically */
    var matched = false;
    for(var a=0;a<all.length;a++){
      if(phoneticallyEqual(all[a], q.speakWord)){ matched = true; break; }
    }
    if(matched){
      handleSpeakingSuccess(q, all[0]);
    } else {
      voiceRetries++;
      if(voiceRetries >= 3){
        status.textContent = '❌ Правильно: ' + q.speakWord;
        setTimeout(function(){ handleSpeakingSuccess(q, all[0] || '(—)'); }, 1200);
      } else {
        status.textContent = t('tryAgain') + ' (' + (3 - voiceRetries) + ')';
        var fb = document.getElementById('feedback');
        fb.textContent = t('wrong');
        fb.className = 'feedback bad';
      }
    }
  };

  rec.onerror = function(event){
    if(finished) return;
    finished = true;
    mic.classList.remove('listening');
    status.textContent = t('tryAgain');
    voiceRetries++;
    if(voiceRetries >= 3){
      setTimeout(function(){ handleSpeakingSuccess(q, '(помилка)'); }, 800);
    }
  };

  rec.onend = function(){
    if(finished) return;
    finished = true;
    mic.classList.remove('listening');
    if(!document.getElementById('micHeard').textContent){
      status.textContent = t('tryAgain');
      voiceRetries++;
      if(voiceRetries >= 3){
        setTimeout(function(){ handleSpeakingSuccess(q, '(тиша)'); }, 800);
      }
    }
  };

  recognition = rec;
  try { rec.start(); } catch(e){
    mic.classList.remove('listening');
    status.textContent = t('tryAgain');
  }
}

function handleSpeakingSuccess(q, heardText){
  var fb = document.getElementById('feedback');
  fb.textContent = t('correct');
  fb.className = 'feedback ok';
  var btn = document.getElementById('mainBtn');
  btn.className = 'btn correct';
  btn.textContent = t('cont');
  btn.disabled = false;
  checked = true;
}

function handleMainBtn(){
  var q = currentLesson.questions[qIndex];

  if(q.type === 'speaking'){
    /* button acts as "continue" only after speaking done */
    if(checked){ advanceQuestion(); }
    return;
  }

  if(!checked){
    checked = true;
    var correct = (selected === q.answerText);
    var opts = document.querySelectorAll('.option');
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add('disabled');
      if(opts[i].textContent === q.answerText) opts[i].classList.add('correct');
      else if(opts[i].textContent === selected) opts[i].classList.add('wrong');
    }
    var fb = document.getElementById('feedback');
    var btn = document.getElementById('mainBtn');
    if(correct){
      fb.textContent = t('correct');
      fb.className = 'feedback ok';
      btn.className = 'btn correct';
    } else {
      fb.textContent = t('wrong');
      fb.className = 'feedback bad';
      btn.className = 'btn wrong';
      var qe = document.getElementById('questionText');
      if(qe){ qe.classList.add('shake'); setTimeout(function(){ qe.classList.remove('shake'); }, 500); }
    }
    btn.textContent = t('cont');
  } else {
    advanceQuestion();
  }
}

function advanceQuestion(){
  if(qIndex < currentLesson.questions.length - 1){
    qIndex++;
    renderQuestion();
  } else {
    state.completed = Math.max(state.completed, currentLessonIndex + 1);
    var gained = 30 + Math.round(currentLesson.questions.length / 2);
    state.xp += gained;
    state.gems += 15;
    saveState();
    var title = prefs.uiLang === 'uk' ? currentLesson.uk : currentLesson.en;
    document.getElementById('completeTitle').textContent = title;
    document.getElementById('xpGained').textContent = gained;
    elLesson.classList.remove('active');
    elComplete.classList.add('active');
  }
}

function exitLesson(){ elLesson.classList.remove('active'); showHome(); }
function backHome(){ elComplete.classList.remove('active'); showHome(); }

/* ============================================================
   DICTIONARY
   ============================================================ */
var dictTimer = null;
var lastQuery = '';
function onDictInput(){
  var q = document.getElementById('dictSearch').value.trim();
  if(q === lastQuery) return;
  lastQuery = q;
  if(dictTimer) clearTimeout(dictTimer);
  if(!q){
    document.getElementById('dictList').innerHTML = '';
    document.getElementById('dictStatus').textContent = t('dictHint');
    return;
  }
  document.getElementById('dictStatus').textContent = t('loadingShort');
  dictTimer = setTimeout(function(){ lookupWord(q); }, 450);
}
function lookupWord(q){
  var list = document.getElementById('dictList');
  var status = document.getElementById('dictStatus');
  list.innerHTML = '';
  var isCyrillic = /[а-яіїєґ]/i.test(q);
  var from = isCyrillic ? 'uk' : 'en';
  var to = isCyrillic ? 'en' : 'uk';
  translate(q, from, to, function(result, fromCache){
    if(!result){ status.textContent = t('emptyDict'); return; }
    status.textContent = fromCache ? t('dictCache') : t('dictOnline');
    var en = from === 'en' ? q : result;
    var uk = from === 'uk' ? q : result;
    renderDictItem(en, uk, fromCache);
  });
}
function renderDictItem(en, uk, fromCache){
  var list = document.getElementById('dictList');
  list.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'dict-item';
  var spkEn = document.createElement('button');
  spkEn.className = 'dict-audio en';
  spkEn.textContent = '🔊';
  spkEn.onclick = function(){ speak(en, 'en'); };
  var spkUk = document.createElement('button');
  spkUk.className = 'dict-audio uk';
  spkUk.textContent = '🔊';
  spkUk.onclick = function(){ speak(uk, 'uk'); };
  var enDiv = document.createElement('div');
  enDiv.className = 'dict-en';
  enDiv.textContent = en;
  if(fromCache){
    var badge = document.createElement('span');
    badge.className = 'dict-badge';
    badge.textContent = '✓';
    enDiv.appendChild(badge);
  }
  var ukDiv = document.createElement('div');
  ukDiv.className = 'dict-uk';
  ukDiv.textContent = uk;
  row.appendChild(spkEn);
  row.appendChild(enDiv);
  row.appendChild(ukDiv);
  row.appendChild(spkUk);
  list.appendChild(row);
}

/* ============================================================
   DEV TOOLS
   ============================================================ */
document.getElementById('logoBtn').addEventListener('click', function(){
  devTapCount++;
  if(devTapTimer) clearTimeout(devTapTimer);
  devTapTimer = setTimeout(function(){ devTapCount = 0; }, 1500);
  if(devTapCount >= 5){
    devTapCount = 0;
    var answer = prompt('6?');
    if(answer === '7'){
      document.getElementById('devBtn').classList.remove('hidden');
      alert('Dev tools unlocked 🔧');
    }
  }
});

function openDevPanel(){
  buildUnlockChips();
  elDev.classList.add('active');
  document.getElementById('devStatus').textContent = '';
}
function closeDevPanel(){ elDev.classList.remove('active'); }

function buildUnlockChips(){
  var cont = document.getElementById('unlockChips');
  cont.innerHTML = '';
  var options = [5, 10, 15, 20, 25, THEMES.length];
  for(var i=0;i<options.length;i++){
    (function(n){
      var chip = document.createElement('button');
      chip.className = 'dev-chip';
      chip.textContent = n === THEMES.length ? 'ALL' : n;
      chip.onclick = function(){
        state.completed = n;
        saveState();
        renderLessons();
        document.getElementById('devStatus').textContent = '✅ Розблоковано до ' + n;
      };
      cont.appendChild(chip);
    })(options[i]);
  }
}
function customUnlockClick(){
  var v = parseInt(document.getElementById('customUnlock').value, 10);
  if(isNaN(v) || v < 0) return;
  if(v > THEMES.length) v = THEMES.length;
  state.completed = v;
  saveState();
  renderLessons();
  document.getElementById('customUnlock').value = '';
  document.getElementById('devStatus').textContent = '✅ Розблоковано до ' + v;
}
function devReset(){
  if(!confirm('Скинути весь прогрес?')) return;
  state.completed = 0;
  state.xp = 0;
  state.gems = 50;
  saveState();
  renderLessons();
  document.getElementById('devStatus').textContent = '🔄 Прогрес скинуто';
}
function lockDev(){
  document.getElementById('devBtn').classList.add('hidden');
  closeDevPanel();
}

loadCache();
refreshUILabels();
renderLessons();
