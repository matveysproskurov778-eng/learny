<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lingo">
<meta name="theme-color" content="#58cc02">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Lingo — Англійська</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#fff;color:#2c2c2c;display:flex;flex-direction:column;user-select:none}

  .topbar{background:linear-gradient(180deg,#58cc02,#4caf00);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:3px solid #3d8b00}
  .logo{font-weight:900;font-size:16px;flex-shrink:0}
  .pills{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
  .pill{background:rgba(255,255,255,.22);padding:4px 9px;border-radius:30px;font-weight:800;font-size:11px;white-space:nowrap}
  .iconbtn{background:rgba(255,255,255,.18);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .iconbtn:active{background:rgba(255,255,255,.35)}

  .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}

  .hero{padding:16px 20px 10px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #f2f2f2}
  .hero-flag{font-size:40px}
  .hero h1{font-size:20px;font-weight:900}
  .hero p{color:#888;font-weight:600;margin-top:2px;font-size:12px}
  .hero-xp{margin-left:auto;text-align:right}
  .hero-xp .big{font-size:22px;font-weight:900;color:#58cc02}
  .hero-xp .lbl{font-size:10px;font-weight:700;color:#999;letter-spacing:1px}

  .unit-header{background:#58cc02;color:#fff;padding:11px 20px;margin-top:10px;display:flex;align-items:center;gap:10px;border-top:2px solid #4caf00;border-bottom:2px solid #3d8b00}
  .unit-num{background:rgba(0,0,0,.2);font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:1px}
  .unit-title{font-size:14px;font-weight:800}

  .path{padding:20px 20px 8px;display:flex;flex-direction:column;align-items:center}
  .node-wrap{display:flex;flex-direction:column;align-items:center}
  .node{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;border:0;position:relative;transition:transform .08s;font-family:inherit}
  .node:active:not(.locked){transform:translateY(3px)}
  .node.avail{background:linear-gradient(180deg,#58cc02,#4caf00);color:#fff;box-shadow:0 5px 0 #3d8b00}
  .node.done{background:linear-gradient(180deg,#ffd900,#f0b800);color:#8b5e00;box-shadow:0 5px 0 #b88a00}
  .node.locked{background:#e5e5e5;color:#a8a8a8;box-shadow:0 5px 0 #c7c7c7;cursor:not-allowed}
  .node.current::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px dashed #58cc02;animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .node-label{font-size:11px;font-weight:800;color:#555;margin-top:4px;text-align:center;max-width:80px}
  .connector{width:4px;height:14px;background:#e5e5e5;border-radius:2px}
  .connector.done{background:#ffd900}

  .lesson-view{display:none;flex-direction:column;flex:1;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);overflow:hidden}
  .lesson-view.active{display:flex}
  .lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0}
  .close-btn{font-size:20px;color:#bbb;cursor:pointer;font-weight:900;background:none;border:none;padding:0 4px;font-family:inherit}
  .prog-bg{flex:1;height:13px;background:#f0f0f0;border-radius:20px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(90deg,#58cc02,#4caf00);border-radius:20px;transition:width .35s;width:0}
  .hearts{font-weight:900;color:#ff4b4b;font-size:14px}
  .question{font-size:20px;font-weight:800;margin-bottom:18px;line-height:1.3}
  .question.small{font-size:17px}
  .speaker-row{display:flex;justify-content:center;margin-bottom:14px}
  .speaker-btn{width:90px;height:90px;border-radius:50%;border:none;background:linear-gradient(180deg,#1cb0f6,#0d8fd0);color:#fff;font-size:40px;cursor:pointer;box-shadow:0 6px 0 #0a6ea0;font-family:inherit}
  .speaker-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0a6ea0}
  .options{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;padding-bottom:6px}
  .option{padding:14px 16px;border:2px solid #e5e5e5;border-bottom-width:5px;border-radius:14px;font-size:15px;font-weight:700;color:#3c3c3c;cursor:pointer;background:#fff;text-align:left;font-family:inherit;transition:.1s}
  .option.selected{border-color:#1cb0f6;background:#ddf4ff;color:#1cb0f6}
  .option.correct{border-color:#58cc02;background:#d7ffb8;color:#4c8b00}
  .option.wrong{border-color:#ff4b4b;background:#ffdfe0;color:#ea2b2b}
  .option.disabled{pointer-events:none}
  .footer{margin-top:auto;padding-top:12px;display:flex;justify-content:flex-end;align-items:center;gap:14px;border-top:2px solid #f0f0f0;flex-shrink:0}
  .feedback{font-weight:900;font-size:15px;margin-right:auto}
  .feedback.ok{color:#58cc02}
  .feedback.bad{color:#ff4b4b}
  .btn{padding:13px 28px;border:none;border-radius:14px;font-size:13px;font-weight:900;letter-spacing:1px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#58cc02,#4caf00);box-shadow:0 4px 0 #3d8b00;font-family:inherit}
  .btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #3d8b00}
  .btn:disabled{background:#e5e5e5;color:#aaa;box-shadow:none;cursor:not-allowed}
  .btn.wrong{background:linear-gradient(180deg,#ff4b4b,#e03030);box-shadow:0 4px 0 #a01f1f}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .shake{animation:shake .45s}

  .dict{display:none;flex-direction:column;flex:1;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px);overflow:hidden}
  .dict.active{display:flex}
  .dict h1{font-size:22px;font-weight:900;margin-bottom:3px}
  .dict .sub{color:#888;font-weight:600;margin-bottom:12px;font-size:12px}
  .search{width:100%;padding:12px 15px;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:14px;font-size:15px;font-weight:600;color:#3c3c3c;outline:none;background:#fafafa;font-family:inherit}
  .search:focus{border-color:#1cb0f6;background:#fff}
  .dict-list{margin-top:12px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .dict-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px solid #f0f0f0;border-bottom-width:4px;border-radius:12px;margin-bottom:7px;background:#fff;cursor:pointer}
  .dict-audio{width:34px;height:34px;border-radius:50%;border:none;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;font-family:inherit}
  .dict-audio.en{background:linear-gradient(180deg,#1cb0f6,#0d8fd0);box-shadow:0 3px 0 #0a6ea0}
  .dict-audio.uk{background:linear-gradient(180deg,#ffb74d,#f39c12);box-shadow:0 3px 0 #c47e00}
  .dict-audio:active{transform:translateY(2px);box-shadow:0 1px 0 #0a6ea0}
  .dict-en{font-size:14px;font-weight:800;flex:1}
  .dict-uk{font-size:13px;font-weight:600;color:#666;flex:1}

  .complete{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:36px 20px;gap:6px}
  .complete.active{display:flex}
  .complete .emoji{font-size:52px}
  .complete h1{font-size:28px;color:#58cc02;font-weight:900;margin-top:4px}
  .complete p{font-size:14px;color:#666;font-weight:600}
  .complete .stats{display:flex;gap:16px;margin:16px 0 22px;font-weight:800;color:#555;font-size:14px}

  .settings{display:none;position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center;padding:20px}
  .settings.active{display:flex}
  .settings-panel{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:330px;max-height:80vh;overflow-y:auto}
  .settings-panel h2{font-size:18px;font-weight:900;margin-bottom:14px}
  .settings-panel label{display:block;font-size:11px;font-weight:800;color:#888;letter-spacing:1px;margin:12px 0 5px}
  .settings-panel select{width:100%;padding:11px 13px;border:2px solid #e5e5e5;border-radius:12px;font-size:15px;font-weight:700;color:#3c3c3c;background:#fafafa;font-family:inherit}
  .settings-panel .close{width:100%;padding:13px;margin-top:16px;border:none;border-radius:12px;background:linear-gradient(180deg,#58cc02,#4caf00);color:#fff;font-weight:900;font-size:13px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 #3d8b00;font-family:inherit}
  .settings-panel .note{font-size:11px;color:#999;margin-top:10px;line-height:1.5}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🦉 Lingo</div>
  <div class="pills">
    <div class="pill">🔥 <span id="streakVal">1</span></div>
    <div class="pill">💎 <span id="gemVal">50</span></div>
    <div class="pill">⚡ <span id="xpVal">0</span></div>
  </div>
  <button class="iconbtn" onclick="toggleSettings()">⚙️</button>
</div>

<div id="homeView" class="main">
  <div class="hero">
    <div class="hero-flag" id="heroFlag">🇬🇧</div>
    <div>
      <h1 id="heroTitle">Англійська</h1>
      <p id="heroSub">0 / 25 уроків</p>
    </div>
    <div class="hero-xp">
      <div class="big" id="heroXpBig">0</div>
      <div class="lbl">XP</div>
    </div>
  </div>
  <div id="pathContainer"></div>
</div>

<div id="lessonView" class="lesson-view">
  <div class="lesson-top">
    <button class="close-btn" onclick="exitLesson()">✕</button>
    <div class="prog-bg"><div class="prog-fill" id="lessonProgress"></div></div>
    <div class="hearts" id="heartsLive">❤️ 5</div>
  </div>
  <div id="questionArea" style="display:flex;flex-direction:column;flex:1;overflow:hidden"></div>
  <div class="footer">
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="mainBtn" disabled onclick="handleMainBtn()">ПЕРЕВІРИТИ</button>
  </div>
</div>

<div id="dictView" class="dict">
  <h1>📖 Словник</h1>
  <div class="sub" id="dictSub">Пошук англійською або українською · 🔊 = англійська · 🟠 = українська</div>
  <input class="search" id="dictSearch" placeholder="Пошук..." oninput="renderDict()">
  <div class="dict-list" id="dictList"></div>
</div>

<div id="completeView" class="complete">
  <div class="emoji">🎉</div>
  <h1 id="completeH1">Урок завершено!</h1>
  <p id="completeTitle"></p>
  <div class="stats">
    <span>⚡ +<span id="xpGained">20</span> XP</span>
    <span>💎 +5</span>
  </div>
  <button class="btn" onclick="backHome()" id="completeBtn">ПРОДОВЖИТИ</button>
</div>

<div class="settings" id="settingsModal" onclick="if(event.target===this)toggleSettings()">
  <div class="settings-panel">
    <h2>⚙️ Налаштування</h2>
    <label>МОВА ІНТЕРФЕЙСУ</label>
    <select id="uiLangSelect" onchange="setUILang(this.value)">
      <option value="uk">🇺🇦 Українська</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <label>МОВА, ЯКУ ВИВЧАЮ</label>
    <select id="learnLangSelect" onchange="setLearnLang(this.value)">
      <option value="en">🇬🇧 Англійська</option>
      <option value="uk">🇺🇦 Українська</option>
    </select>
    <div class="note">Голос використовує мовний рушій пристрою. На iPhone це Siri-голоси.</div>
    <button class="close" onclick="toggleSettings()">ЗАКРИТИ</button>
  </div>
</div>

<script>

  uk: { lessons:'уроків', check:'ПЕРЕВІРИТИ', cont:'ПРОДОВЖИТИ',

        locked:'Locked', completed:'Completed' }

  { uk:'Привітання',        en:'Greetings',    icon:'👋', from:0,  count:5 },

/* ===== BUILD LESSONS ===== */
var LESSONS = [];
(function(){
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  for(var i=0;i<25;i++){
    var unit=null;
    for(var u=0;u<UNITS.length;u++){if(i>=UNITS[u].from&&i<UNITS[u].from+UNITS[u].count){unit=UNITS[u];break;}}
    var words = VOCAB[i];
    var qs = [
      { type:'mc', q:'Яке слово означає "' + words[0][1] + '"?',
        options: shuffle([words[0][0], words[1][0], words[2][0], words[3][0]]),
        answerText: words[0][0] },
      { type:'mc', q:'Що означає "' + words[1][0] + '"?',
        options: shuffle([words[1][1], words[2][1], words[3][1], words[0][1]]),
        answerText: words[1][1] },
      { type:'voice', q:'Прослухайте та виберіть англійське слово:',
        speak: words[2][0], speakLang:'en',
        options: shuffle([words[2][0], words[0][0], words[1][0], words[3][0]]),
        answerText: words[2][0] },
      { type:'voice', q:'Що це означає?',
        speak: words[3][0], speakLang:'en',
        options: shuffle([words[3][1], words[0][1], words[1][1], words[2][1]]),
        answerText: words[3][1] }
    ];
    LESSONS.push({
      id:i+1, title:'Урок '+(i+1), title_en:'Lesson '+(i+1),
      unit_uk:unit.uk, unit_en:unit.en, unitIcon:unit.icon, unitIndex:u,
      questions:qs
    });
  }
})();

/* ===== STATE ===== */
var STORAGE_KEY = 'lingo_state_v2';
var prefs = { uiLang:'uk', learnLang:'en' };
var state = { completed:0, xp:0, gems:50, streak:1, hearts:5 };
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({state:state, prefs:prefs})); }catch(e){} }
function loadState(){ try{ var r=localStorage.getItem(STORAGE_KEY); if(r){var p=JSON.parse(r); if(p.state)for(var k in p.state)state[k]=p.state[k]; if(p.prefs)for(var k2 in p.prefs)prefs[k2]=p.prefs[k2];} }catch(e){} }

/* ===== SPEECH ===== */
function speak(text, lang){
  try {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var t = (lang||'en').toLowerCase();
    u.lang = t === 'uk' ? 'uk-UA' : 'en-US';
    u.rate = 0.85;
    var voices = window.speechSynthesis.getVoices() || [];
    for(var i=0;i<voices.length;i++){ if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(t) === 0){ u.voice = voices[i]; break; } }
    window.speechSynthesis.speak(u);
  } catch(e){}
}
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function(){};

/* ===== NAV ===== */
var elHome=document.getElementById('homeView'), elLesson=document.getElementById('lessonView'),
    elDict=document.getElementById('dictView'), elComplete=document.getElementById('completeView'),
    elSettings=document.getElementById('settingsModal');
function t(k){ var L=UI[prefs.uiLang]||UI.uk; return L[k]||k; }

function refreshUILabels(){
  document.getElementById('heroTitle').textContent = prefs.uiLang==='uk'
    ? (prefs.learnLang==='en'?'Англійська':'Українська')
    : (prefs.learnLang==='en'?'English':'Ukrainian');
  document.getElementById('heroFlag').textContent = prefs.learnLang==='en' ? '🇬🇧' : '🇺🇦';
  document.getElementById('mainBtn').textContent = t('check');
  document.getElementById('completeH1').textContent = t('complete');
  document.getElementById('completeBtn').textContent = t('cont');
}

function showHome(){ elHome.style.display=''; elLesson.classList.remove('active'); elDict.classList.remove('active'); elComplete.classList.remove('active'); renderPath(); }
function showDict(){ elHome.style.display='none'; elLesson.classList.remove('active'); elDict.classList.add('active'); elComplete.classList.remove('active'); renderDict(); }
function toggleSettings(){ elSettings.classList.toggle('active'); }
function setUILang(v){ prefs.uiLang=v; saveState(); refreshUILabels(); renderPath(); }
function setLearnLang(v){ prefs.learnLang=v; saveState(); refreshUILabels(); renderPath(); }

/* ===== PATH ===== */
function renderPath(){
  document.getElementById('heroSub').textContent = state.completed + ' / 25 ' + t('lessons');
  document.getElementById('heroXpBig').textContent = state.xp;
  document.getElementById('xpVal').textContent = state.xp;
  document.getElementById('gemVal').textContent = state.gems;
  document.getElementById('streakVal').textContent = state.streak;

  var cont = document.getElementById('pathContainer');
  cont.innerHTML='';
  var lastUnit=-1;
  for(var i=0;i<LESSONS.length;i++){
    var L = LESSONS[i];
    if(L.unitIndex !== lastUnit){
      lastUnit = L.unitIndex;
      var uh = document.createElement('div');
      uh.className='unit-header';
      var uname = prefs.uiLang==='uk' ? L.unit_uk : L.unit_en;
      uh.innerHTML = '<div class="unit-num">UNIT ' + (L.unitIndex+1) + '</div><div class="unit-title">' + L.unitIcon + '  ' + uname + '</div>';
      cont.appendChild(uh);
      var p = document.createElement('div');
      p.className='path'; p.id='path-'+L.unitIndex;
      cont.appendChild(p);
    }
    var path = document.getElementById('path-'+L.unitIndex);
    var wrap = document.createElement('div');
    wrap.className='node-wrap';

    if(i>0 && LESSONS[i].unitIndex === LESSONS[i-1].unitIndex){
      var c = document.createElement('div');
      c.className='connector' + (i <= state.completed ? ' done' : '');
      path.appendChild(c);
    }
    var locked = i > state.completed;
    var done = i < state.completed;
    var isCurrent = (i === state.completed);
    var btn = document.createElement('button');
    btn.className = 'node ' + (locked?'locked':done?'done':'avail') + (isCurrent?' current':'');
    btn.innerHTML = locked ? '🔒' : done ? '★' : '🌟';
    if(!locked){ (function(idx){ btn.onclick = function(){ startLesson(idx); }; })(i); }
    var lbl = document.createElement('div');
    lbl.className='node-label';
    lbl.textContent = done ? t('completed') : locked ? t('locked') : (prefs.uiLang==='uk'?L.title:L.title_en);
    wrap.appendChild(btn); wrap.appendChild(lbl); path.appendChild(wrap);
  }
}

/* ===== LESSON ===== */
var currentLesson=null, currentLessonIndex=-1, qIndex=0, selected=null, checked=false, hearts=5;
function startLesson(index){
  currentLessonIndex=index; currentLesson = LESSONS[index];
  qIndex=0; hearts=5; selected=null; checked=false;
  elHome.style.display='none'; elDict.classList.remove('active'); elComplete.classList.remove('active');
  elLesson.classList.add('active');
  document.getElementById('heartsLive').textContent='❤️ '+hearts;
  renderQuestion();
}

function renderQuestion(){
  var q = currentLesson.questions[qIndex];
  document.getElementById('lessonProgress').style.width = ((qIndex+1)/currentLesson.questions.length*100)+'%';
  document.getElementById('heartsLive').textContent='❤️ '+hearts;
  var area = document.getElementById('questionArea');
  area.innerHTML='';

  if(q.type === 'voice'){
    var row = document.createElement('div'); row.className='speaker-row';
    var spk = document.createElement('button'); spk.className='speaker-btn'; spk.innerHTML='🔊';
    spk.onclick = function(){ speak(q.speak, q.speakLang||'en'); };
    row.appendChild(spk); area.appendChild(row);
    setTimeout(function(){ speak(q.speak, q.speakLang||'en'); }, 350);
  }
  var qt = document.createElement('div');
  qt.className = 'question' + (q.type==='voice'?' small':'');
  qt.id='questionText'; qt.textContent = q.q;
  area.appendChild(qt);

  var box = document.createElement('div'); box.className='options'; box.id='optionsBox';
  for(var i=0;i<q.options.length;i++){
    var opt = document.createElement('button');
    opt.className='option'; opt.textContent = q.options[i];
    (function(txt, el){ el.onclick = function(){ selectOption(txt, el); }; })(q.options[i], opt);
    box.appendChild(opt);
  }
  area.appendChild(box);
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  var btn = document.getElementById('mainBtn');
  btn.textContent = t('check'); btn.disabled=true; btn.className='btn';
  selected=null; checked=false;
}

function selectOption(text, el){
  if(checked) return;
  selected = text;
  var opts = document.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('selected');
  el.classList.add('selected');
  document.getElementById('mainBtn').disabled = false;
}

function handleMainBtn(){
  var q = currentLesson.questions[qIndex];
  if(!checked){
    checked=true;
    var correct = (selected === q.answerText);
    var opts = document.querySelectorAll('.option');
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add('disabled');
      if(opts[i].textContent === q.answerText) opts[i].classList.add('correct');
      else if(opts[i].textContent === selected) opts[i].classList.add('wrong');
    }
    var fb = document.getElementById('feedback'), btn = document.getElementById('mainBtn');
    if(correct){ fb.textContent = t('correct'); fb.className='feedback ok'; }
    else {
      hearts--; document.getElementById('heartsLive').textContent='❤️ '+hearts;
      fb.textContent = t('wrong'); fb.className='feedback bad'; btn.className='btn wrong';
      var qe = document.getElementById('questionText');
      qe.classList.add('shake'); setTimeout(function(){ qe.classList.remove('shake'); }, 500);
    }
    btn.textContent = t('cont');
    if(hearts <= 0){
      setTimeout(function(){ alert(prefs.uiLang==='uk'?'Скінчилися серця!':'Out of hearts!'); hearts=5; exitLesson(); }, 700);
    }
  } else {
    if(qIndex < currentLesson.questions.length - 1){ qIndex++; renderQuestion(); }
    else {
      state.completed = Math.max(state.completed, currentLessonIndex + 1);
      state.xp += 20; state.gems += 5; saveState();
      var title = prefs.uiLang==='uk'
        ? (currentLesson.title + ' · ' + currentLesson.unit_uk)
        : (currentLesson.title_en + ' · ' + currentLesson.unit_en);
      document.getElementById('completeTitle').textContent = title;
      document.getElementById('xpGained').textContent = 20;
      elLesson.classList.remove('active');
      elComplete.classList.add('active');
    }
  }
}
function exitLesson(){ elLesson.classList.remove('active'); showHome(); }
function backHome(){ elComplete.classList.remove('active'); showHome(); }

/* ===== DICTIONARY ===== */
function renderDict(){
  var q = (document.getElementById('dictSearch').value||'').toLowerCase().trim();
  var list = document.getElementById('dictList');
  list.innerHTML='';
  var results = [];
  for(var i=0;i<DICTIONARY_FULL.length;i++){
    var d = DICTIONARY_FULL[i];
    if(!q || d[0].toLowerCase().indexOf(q) >= 0 || d[1].toLowerCase().indexOf(q) >= 0) results.push(d);
  }
  if(results.length === 0){ list.innerHTML='<div style="color:#999;padding:20px;font-weight:600">—</div>'; return; }
  for(var j=0;j<results.length;j++){
    (function(entry){
      var row = document.createElement('div'); row.className='dict-item';

      var spkEn = document.createElement('button');
      spkEn.className='dict-audio en'; spkEn.textContent='🔊'; spkEn.title='English';
      spkEn.onclick = function(e){ if(e&&e.stopPropagation)e.stopPropagation(); speak(entry[0], 'en'); };

      var spkUk = document.createElement('button');
      spkUk.className='dict-audio uk'; spkUk.textContent='🟠'; spkUk.title='Українська';
      spkUk.onclick = function(e){ if(e&&e.stopPropagation)e.stopPropagation(); speak(entry[1], 'uk'); };

      var en = document.createElement('div'); en.className='dict-en'; en.textContent = entry[0];
      var uk = document.createElement('div'); uk.className='dict-uk'; uk.textContent = entry[1];

      row.appendChild(spkEn); row.appendChild(spkUk); row.appendChild(en); row.appendChild(uk);
      row.onclick = function(){ speak(entry[0], 'en'); };
      list.appendChild(row);
    })(results[j]);
  }
}

/* ===== BOOT ===== */
loadState();
refreshUILabels();
renderPath();
</script>
